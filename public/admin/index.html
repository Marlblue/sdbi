<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Admin Artikel — SDBI</title>
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      var PREVIEW_STYLE =
        "body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1f2937;}" +
        ".sdbi-article{border-bottom:8px solid #e5e7eb;padding-bottom:32px;margin-bottom:32px;}" +
        ".sdbi-serp{border:1px solid #dadce0;border-radius:8px;padding:16px;margin-bottom:16px;background:#fff;font-family:arial,sans-serif;}" +
        ".sdbi-serp-label{font-size:11px;font-weight:700;letter-spacing:.05em;color:#9aa0a6;text-transform:uppercase;margin-bottom:8px;}" +
        ".sdbi-serp-url{color:#202124;font-size:14px;margin-bottom:2px;}" +
        ".sdbi-serp-title{color:#1a0dab;font-size:20px;line-height:1.3;margin-bottom:3px;}" +
        ".sdbi-serp-desc{color:#4d5156;font-size:14px;line-height:1.4;}" +
        ".sdbi-hero{background:#0A1E3F;border-radius:12px 12px 0 0;padding:24px;}" +
        ".sdbi-badge{display:inline-block;background:#F5821F;color:#fff;font-size:11px;font-weight:600;padding:4px 12px;border-radius:9999px;margin-bottom:10px;}" +
        ".sdbi-hero h1{color:#fff;font-size:22px;line-height:1.3;margin:0 0 8px;}" +
        ".sdbi-hero .meta{color:#d1d5db;font-size:11px;text-transform:uppercase;letter-spacing:.05em;}" +
        ".sdbi-image{width:100%;max-height:340px;object-fit:cover;display:block;}" +
        ".sdbi-body{border:1px solid #e5e7eb;border-top:0;border-radius:0 0 12px 12px;padding:24px;background:#fff;}" +
        ".sdbi-body img{max-width:100%;}" +
        ".sdbi-body h2{font-size:18px;color:#0A1E3F;margin-top:20px;}" +
        ".sdbi-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid #e5e7eb;}" +
        ".sdbi-tag{font-size:11px;background:#f3f4f6;color:#6b7280;padding:5px 12px;border-radius:9999px;}" +
        ".sdbi-faq{margin-top:16px;padding:16px;background:#f9fafb;border-radius:8px;}" +
        ".sdbi-faq-title{font-size:13px;font-weight:700;color:#0A1E3F;margin-bottom:8px;}" +
        ".sdbi-faq-item{margin-bottom:10px;}" +
        ".sdbi-faq-q{font-size:13px;font-weight:600;color:#111827;}" +
        ".sdbi-faq-a{font-size:13px;color:#4b5563;margin-top:2px;}" +
        ".sdbi-empty{color:#9ca3af;font-style:italic;}";

      CMS.registerPreviewStyle(PREVIEW_STYLE, { raw: true });

      function truncate(str, max) {
        if (!str) return "";
        return str.length > max ? str.slice(0, max - 1) + "…" : str;
      }

      var ArticlesFilePreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var getAsset = this.props.getAsset;
          var articles = entry.getIn(["data", "articles"]);

          if (!articles || articles.size === 0) {
            return h("div", { className: "sdbi-empty" }, "Belum ada artikel.");
          }

          var cards = articles
            .map(function (article, index) {
              var title = article.get("title") || "";
              var slug = article.get("slug") || "";
              var excerpt = article.get("excerpt") || "";
              var date = article.get("date") || "";
              var readTime = article.get("readTime") || "";
              var category = article.get("category") || "Uncategorized";
              var content = article.get("content") || "";
              var image = article.get("image");
              var tags = article.get("tags");
              var seo = article.get("seo");

              var seoTitle = (seo && seo.get("seoTitle")) || title;
              var metaDescription = (seo && seo.get("metaDescription")) || excerpt;
              var faq = seo && seo.get("faq");

              var imageUrl = image ? getAsset(image).toString() : null;

              return h(
                "div",
                { className: "sdbi-article", key: slug || index },
                h(
                  "div",
                  { className: "sdbi-serp" },
                  h("div", { className: "sdbi-serp-label" }, "Preview Google Search"),
                  h(
                    "div",
                    { className: "sdbi-serp-url" },
                    "sekolahdigitalbisnis.com › " + (slug || "slug-artikel")
                  ),
                  h("div", { className: "sdbi-serp-title" }, truncate(seoTitle, 60) || "(Judul kosong)"),
                  h("div", { className: "sdbi-serp-desc" }, truncate(metaDescription, 160) || "(Meta description kosong)")
                ),
                h(
                  "div",
                  { className: "sdbi-hero" },
                  h("span", { className: "sdbi-badge" }, category),
                  h("h1", {}, title || "(Judul kosong)"),
                  h("div", { className: "meta" }, date + " · " + readTime)
                ),
                imageUrl
                  ? h("img", { className: "sdbi-image", src: imageUrl, alt: title })
                  : null,
                h(
                  "div",
                  { className: "sdbi-body" },
                  h("div", { dangerouslySetInnerHTML: { __html: content } }),
                  tags && tags.size > 0
                    ? h(
                        "div",
                        { className: "sdbi-tags" },
                        tags
                          .map(function (tag, i) {
                            return h("span", { className: "sdbi-tag", key: i }, "#" + tag);
                          })
                          .toArray()
                      )
                    : null,
                  faq && faq.size > 0
                    ? h(
                        "div",
                        { className: "sdbi-faq" },
                        h("div", { className: "sdbi-faq-title" }, "FAQ"),
                        faq
                          .map(function (item, i) {
                            return h(
                              "div",
                              { className: "sdbi-faq-item", key: i },
                              h("div", { className: "sdbi-faq-q" }, item.get("question")),
                              h("div", { className: "sdbi-faq-a" }, item.get("answer"))
                            );
                          })
                          .toArray()
                      )
                    : null
                )
              );
            })
            .toArray();

          return h("div", {}, cards);
        },
      });

      CMS.registerPreviewTemplate("articlesFile", ArticlesFilePreview);
    </script>
  </body>
</html>
