backend:
  name: github
  repo: Marlblue/sdbi
  branch: main
  base_url: https://www.sekolahdigitalbisnis.com
  auth_endpoint: api/auth

local_backend: true

publish_mode: simple
media_folder: "public/blog-images"
public_folder: "/blog-images"

collections:
  - name: "articles"
    label: "Artikel"
    files:
      - file: "app/lib/articles-data.json"
        label: "Daftar Artikel"
        name: "articlesFile"
        fields:
          - label: "Artikel"
            name: "articles"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Slug (untuk URL)", name: "slug", widget: "string", hint: "Huruf kecil, pisahkan kata dengan tanda hubung. Contoh: cara-menaikkan-omzet-umkm" }
              - { label: "Judul", name: "title", widget: "string" }
              - { label: "Tanggal", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "Ringkasan Singkat", name: "excerpt", widget: "text" }
              - { label: "Isi Artikel", name: "content", widget: "markdown" }
              - { label: "Gambar Utama", name: "image", widget: "image" }
              - { label: "Kategori", name: "category", widget: "string", default: "Uncategorized" }
              - { label: "Tags", name: "tags", widget: "list", default: [], hint: "Tag ini akan tampil sebagai link yang bisa diklik di halaman artikel, mengarah ke /blog yang sudah difilter per tag." }
              - { label: "Estimasi Waktu Baca", name: "readTime", widget: "string", default: "5 MENIT BACA" }
              - label: "SEO"
                name: "seo"
                widget: "object"
                collapsed: true
                required: false
                fields:
                  - { label: "SEO Title", name: "seoTitle", widget: "string", required: false, hint: "Override judul yang tampil di tab browser & hasil pencarian Google. Kosongkan untuk pakai Judul di atas." }
                  - { label: "Meta Description", name: "metaDescription", widget: "text", required: false, hint: "150-160 karakter. Kosongkan untuk pakai Ringkasan Singkat." }
                  - { label: "Focus Keyword", name: "focusKeyword", widget: "string", required: false }
                  - { label: "Secondary Keywords", name: "secondaryKeywords", widget: "list", required: false, default: [] }
                  - { label: "Alt Text Gambar Utama", name: "imageAlt", widget: "string", required: false, hint: "Kosongkan untuk pakai Judul." }
                  - { label: "OG Title (Facebook)", name: "ogTitle", widget: "string", required: false }
                  - { label: "OG Description (Facebook)", name: "ogDescription", widget: "text", required: false }
                  - { label: "Twitter Title", name: "twitterTitle", widget: "string", required: false }
                  - { label: "Twitter Description", name: "twitterDescription", widget: "text", required: false }
                  - label: "FAQ"
                    name: "faq"
                    widget: "list"
                    required: false
                    default: []
                    summary: "{{question}}"
                    fields:
                      - { label: "Pertanyaan", name: "question", widget: "string" }
                      - { label: "Jawaban", name: "answer", widget: "text" }
